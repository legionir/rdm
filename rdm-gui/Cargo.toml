[package]
name = "rdm-gui"
version = "0.1.0"
edition = "2021"
description = "Native desktop GUI for rdm — full feature parity with the CLI"
license = "MIT"
publish = false

[[bin]]
name = "rdm-gui"
path = "src/main.rs"

[dependencies]
rdm = { path = ".." }
# Clipboard: “paste a link, press New”, the tray entry and the details copies.
arboard = "3.4"
# System tray (icon + menu) and its menu primitives.
tray-icon = "0.26"
# Work-area query for the floating drop target (Windows only).
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "time", "sync", "signal"] }
anyhow = "1.0.95"
serde_json = "1.0.140"
url = "2.5.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
# Embeds assets/icon.ico into the Windows executable (build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile = "3.15.0"

[profile.release]
lto = "thin"
codegen-units = 4
