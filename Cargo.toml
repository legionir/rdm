[package]
name = "rdm"
version = "0.1.0"
edition = "2021"
description = "rdm — a multi-threaded, resumable CLI download manager written in Rust"
license = "MIT"
authors = ["rdm contributors"]
rust-version = "1.82"

[[bin]]
name = "rdm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "stream"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
futures-channel = "0.3.31"
tokio-util = { version = "0.7.2", features = [] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
clap = { version = "4.5.16", features = ["derive"] }
indicatif = { version = "0.17.11", default-features = false, features = ["unicode-width"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
thiserror = "2.0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
url = "2.5.4"
sha2 = "0.10.8"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.15.0"

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
