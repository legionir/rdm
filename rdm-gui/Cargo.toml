[package]
name = "rdm-gui"
version = "0.1.0"
edition = "2021"
description = "Native desktop GUI for rdm — full feature parity with the CLI"
license = "MIT"
publish = false

[[bin]]
name = "rdm-gui"
path = "src/main.rs"

[dependencies]
rdm = { path = ".." }
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread", "time", "sync", "signal"] }
anyhow = "1.0.95"
serde_json = "1.0.140"
url = "2.5.4"

[profile.release]
lto = "thin"
codegen-units = 4
