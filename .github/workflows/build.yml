name: Build rdm (CLI + GUI)

on:
  push:
    branches: [main, arena/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure vendored sources
        run: |
          mkdir -p .cargo
          cp vendor-config.txt .cargo/config.toml
      - name: Build CLI binary
        run: cargo build --release --locked
      - name: Stage CLI binary
        run: |
          mkdir -p dist
          cp target/release/rdm dist/rdm-linux-x86_64
          chmod +x dist/rdm-linux-x86_64
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-linux-x86_64
          path: dist/rdm-linux-x86_64
          if-no-files-found: error

  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build CLI binary
        # Do not use vendor/ + --locked here. The lockfile/vendor tree was
        # produced on Linux and is missing some Windows-only crates, so a
        # vendored locked build fails before rustc even starts.
        run: cargo build --release
      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rdm.exe dist/rdm-windows-x86_64.exe
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-windows-x86_64.exe
          path: dist/rdm-windows-x86_64.exe
          if-no-files-found: error

  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure vendored sources
        run: |
          mkdir -p .cargo
          cp vendor-config.txt .cargo/config.toml || true
      - name: Build GUI binary (requires egui in vendor/network)
        run: |
          if cargo build --release --locked --features gui; then
            mkdir -p dist
            cp target/release/rdm dist/rdm-gui-linux-x86_64
            chmod +x dist/rdm-gui-linux-x86_64
          else
            echo "GUI build skipped: egui/eframe dependencies not vendored or unavailable"
          fi
      - name: Upload GUI artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: rdm-gui-linux-x86_64
          path: dist/rdm-gui-linux-x86_64
          if-no-files-found: ignore

  release:
    needs: [build-cli-linux, build-cli-windows, build-gui]
    if: always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build-cli-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          ignore-missing: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la artifacts
          test -f artifacts/rdm-linux-x86_64

          ASSETS=(artifacts/rdm-linux-x86_64)
          if [[ -f artifacts/rdm-windows-x86_64.exe ]]; then
            ASSETS+=(artifacts/rdm-windows-x86_64.exe)
          fi
          if [[ -f artifacts/rdm-gui-linux-x86_64 ]]; then
            ASSETS+=(artifacts/rdm-gui-linux-x86_64)
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "rdm ${TAG}" \
              --notes "Release ${TAG} (\`${GITHUB_SHA}\`)." \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          else
            TAG="nightly"
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
            fi
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "rdm nightly" \
              --notes "Automatic build from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)." \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
