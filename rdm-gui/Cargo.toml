[package]
name = "rdm-gui"
version = "0.1.0"
edition = "2021"
description = "Native desktop GUI for rdm"
license = "MIT"
publish = false

[[bin]]
name = "rdm-gui"
path = "src/main.rs"

[dependencies]
rdm = { path = ".." }
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
