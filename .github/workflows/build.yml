name: Build rdm (Windows tests + GUI)

on:
  push:
    branches: [main, arena/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Disable vendored crates.io (Windows line endings break vendor checksums)
        shell: bash
        run: rm -f .cargo/config.toml .cargo/config
      - name: Unit + integration tests
        run: cargo test --all-targets

  build-gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Disable vendored crates.io
        shell: bash
        run: rm -f .cargo/config.toml .cargo/config
      - name: Build GUI binary
        working-directory: rdm-gui
        run: cargo build --release
      - name: Surface compiler errors
        if: failure()
        working-directory: rdm-gui
        shell: bash
        run: |
          # Actions logs are not always downloadable, so a failed build echoes
          # its diagnostics back as a single workflow annotation, which is
          # readable through the REST API. Dependencies are already compiled,
          # so re-running the build costs seconds.
          out=$(cargo build --release --message-format=short 2>&1 | grep -E 'error(\[|:)' | tail -50)
          printf '::error title=rustc::%s\n' \
            "$(printf '%s' "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: Test GUI crate
        working-directory: rdm-gui
        shell: bash
        run: cargo test --release
      - name: Stage GUI binary
        shell: bash
        run: |
          mkdir -p dist
          cp rdm-gui/target/release/rdm-gui.exe dist/rdm-gui-windows-x86_64.exe
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-gui-windows-x86_64.exe
          path: dist/rdm-gui-windows-x86_64.exe
          if-no-files-found: error
