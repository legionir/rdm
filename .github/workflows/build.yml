name: Build rdm (CLI + GUI)

on:
  push:
    branches: [main, arena/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rdm-linux-x86_64
            binary: rdm
          - os: windows-latest
            artifact: rdm-windows-x86_64.exe
            binary: rdm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure vendored sources
        shell: bash
        run: |
          mkdir -p .cargo
          if [ -f vendor-config.txt ]; then
            cp vendor-config.txt .cargo/config.toml
          else
            printf '%s\n' \
              '[source.crates-io]' \
              'replace-with = "vendored-sources"' \
              '[source.vendored-sources]' \
              'directory = "vendor"' > .cargo/config.toml
          fi
      - name: Build CLI binary
        run: cargo build --release --locked
      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure vendored sources
        run: |
          mkdir -p .cargo
          cp vendor-config.txt .cargo/config.toml || true
      - name: Build GUI binary (requires egui in vendor/network)
        run: |
          if cargo build --release --locked --features gui; then
            mkdir -p dist
            cp target/release/rdm dist/rdm-gui-linux-x86_64
            chmod +x dist/rdm-gui-linux-x86_64
          else
            echo "GUI build skipped: egui/eframe dependencies not vendored or unavailable"
          fi
      - name: Upload GUI artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: rdm-gui-linux-x86_64
          path: dist/rdm-gui-linux-x86_64
          if-no-files-found: ignore

  release:
    needs: [build-cli, build-gui]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la artifacts
          test -f artifacts/rdm-linux-x86_64

          ASSETS=(artifacts/rdm-linux-x86_64)
          if [[ -f artifacts/rdm-windows-x86_64.exe ]]; then
            ASSETS+=(artifacts/rdm-windows-x86_64.exe)
          fi
          if [[ -f artifacts/rdm-gui-linux-x86_64 ]]; then
            ASSETS+=(artifacts/rdm-gui-linux-x86_64)
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "rdm ${TAG}" \
              --notes "Release ${TAG} (\`${GITHUB_SHA}\`)." \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          else
            TAG="nightly"
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
            fi
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "rdm nightly" \
              --notes "Automatic build from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)." \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
