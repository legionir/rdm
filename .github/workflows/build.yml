name: Build rdm (Windows tests + GUI)

on:
  push:
    branches: [main, arena/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Disable vendored crates.io (Windows line endings break vendor checksums)
        shell: bash
        run: rm -f .cargo/config.toml .cargo/config
      - name: Unit + integration tests
        run: cargo test --all-targets

  build-gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Disable vendored crates.io
        shell: bash
        run: rm -f .cargo/config.toml .cargo/config
      - name: Build GUI binary
        working-directory: rdm-gui
        run: cargo build --release
      - name: Surface compiler errors
        if: failure()
        working-directory: rdm-gui
        shell: bash
        run: |
          # Actions logs are not always downloadable, so a failed build echoes
          # its diagnostics back as a single workflow annotation, which is
          # readable through the REST API. Dependencies are already compiled,
          # so re-running the build costs seconds.
          #
          # The step must never fail on its own: `grep` exits 1 when there is
          # nothing to report, which under `set -e -o pipefail` would abort the
          # step before the annotation is emitted. Always report *something*.
          diag="${RUNNER_TEMP:-/tmp}/rdm-gui-build.txt"
          set +e
          cargo build --release --message-format=short >"$diag" 2>&1
          status=$?
          out=$(grep -E 'error(\[|:)' "$diag" | tail -50)
          if [ -z "$out" ]; then
            out=$(tail -60 "$diag")
          fi
          if [ -z "$out" ]; then
            out="cargo exited with status $status and produced no output"
          fi
          printf '::error title=rustc (exit %s)::%s\n' "$status" \
            "$(printf '%s' "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: Test GUI crate
        id: gui-tests
        working-directory: rdm-gui
        shell: bash
        run: cargo test --release
      - name: Surface test failures
        if: failure() && steps.gui-tests.outcome == 'failure'
        working-directory: rdm-gui
        shell: bash
        run: |
          # Same reasoning as the build step above: failing test names and
          # assertions have to reach the review API as an annotation, because
          # the raw job log is not always downloadable.
          diag="${RUNNER_TEMP:-/tmp}/rdm-gui-tests.txt"
          set +e
          cargo test --release --no-fail-fast >"$diag" 2>&1
          status=$?
          out=$(grep -E '^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|assertion|left:|right:|error\[)' "$diag" | head -60)
          if [ -z "$out" ]; then
            out=$(grep -E 'FAILED|panicked|assertion|test result' "$diag" | head -60)
          fi
          if [ -z "$out" ]; then
            out=$(tail -60 "$diag")
          fi
          printf '::error title=gui tests (exit %s)::%s\n' "$status" \
            "$(printf '%s' "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Stage GUI binary
        shell: bash
        run: |
          mkdir -p dist
          cp rdm-gui/target/release/rdm-gui.exe dist/rdm-gui-windows-x86_64.exe
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-gui-windows-x86_64.exe
          path: dist/rdm-gui-windows-x86_64.exe
          if-no-files-found: error

  release:
    # Publishing is *this* job, not the build jobs above. `upload-artifact` only
    # stores a 90-day file under the run (Actions -> run -> Artifacts); the
    # Releases page is served by the Releases API and needs a token that can
    # write repository contents, plus an explicit `gh release ...` call.
    #
    # Trigger: a hand-pushed `v*` tag (see `on: push: tags` above). A tag push
    # starts a fresh run whose workflow file comes from the tagged commit, so
    # the tag must be created/pushed for this job to do anything — merging a PR
    # moves `main` and uploads an artifact, and changes nothing on Releases.
    #
    #   git tag -a v0.1.0 -m "rdm v0.1.0" && git push origin v0.1.0
    #
    # The run is green only if both the CLI tests and the GUI build+tests pass,
    # so a broken tag never publishes binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, build-gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create / upload
      actions: read     # actions/download-artifact@v4 reads this run's artifacts
    steps:
      - name: Download GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: rdm-gui-windows-x86_64.exe
          path: dist
      - name: Publish release
        env:
          # gh authenticates from GH_TOKEN; the job-level `contents: write`
          # permission is what makes this token able to create a release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          test -f dist/rdm-gui-windows-x86_64.exe
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Re-run of a tag build (or a retried job): refresh the assets of the
            # existing release instead of failing on it.
            gh release upload "${TAG}" dist/*.exe \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/*.exe \
              --title "rdm ${TAG}" \
              --generate-notes \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          fi
